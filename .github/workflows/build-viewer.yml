# 3D 查看器云端构建: viewer3d/(vendored Forza Livery Studio 快照 + 自研查看器壳)
# → FH6Livery3DViewer-win64.zip 工件(exe + Qt DLL + assets)。
# 触发: feat/viewer3d 分支的 viewer3d/** 变更 + 手动 dispatch; 发布流水线
# (release.yml) 复用同配方把产物打进五语言 zip 的 3DViewer/ 子目录。
name: build-viewer

on:
  push:
    branches: ['feat/viewer3d', main]
    paths: ['viewer3d/**', '.github/workflows/build-viewer.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Qt (aqt 预编译, msvc2022_64)
        uses: jurplel/install-qt-action@v4.4.1
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 编译缓存 sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: 安装 zlib (vcpkg, 默认 installed 树)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install zlib:x64-windows
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: CMake 配置 + 构建
        shell: pwsh
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          cmake -S viewer3d -B viewer3d\build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build viewer3d\build --config Release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          sccache --show-stats

      - name: windeployqt 收集运行时
        shell: pwsh
        run: |
          $bin = "viewer3d\build\FH6Livery3DViewer.exe"
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations --no-opengl-sw $bin
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 打包 zip (exe + DLL + assets)
        shell: pwsh
        run: |
          $stage = "stage\FH6Livery3DViewer"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item viewer3d\build\FH6Livery3DViewer.exe $stage
          Copy-Item viewer3d\build\*.dll $stage -ErrorAction SilentlyContinue
          Copy-Item viewer3d\build\platforms, viewer3d\build\imageformats, `
            viewer3d\build\styles, viewer3d\build\iconengines $stage `
            -ErrorAction SilentlyContinue -Recurse
          Copy-Item viewer3d\assets $stage\assets -Recurse
          Copy-Item viewer3d\SOURCE.md $stage\SOURCE.md
          Copy-Item viewer3d\licenses $stage\licenses -Recurse
          # D3DCompile is loaded dynamically; some Windows 10 installs cannot load
          # d3dcompiler_47.dll (old msvcp_win), so never ship it.
          Remove-Item $stage\D3Dcompiler_47.dll -ErrorAction SilentlyContinue
          # Ship the VC++ runtime the exe links against (MSVCP140*/VCRUNTIME140*).
          Copy-Item "$env:VCToolsRedistDir\x64\Microsoft.VC143.CRT\*.dll" $stage -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: FH6Livery3DViewer-win64
          path: stage/FH6Livery3DViewer
          retention-days: 30
